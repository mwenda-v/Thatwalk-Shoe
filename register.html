<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a new password | That Walk & Shoe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="reset">
  <div class="auth-container">

    <main class="auth-left">
      <div class="auth-card">
        <a class="brand" href="index.html">
          <img src="Logo.jpeg" alt="">
          <span>That Walk &amp; Shoe</span>
        </a>

        <h1>Choose a new password</h1>
        <p class="subtitle">Pick something you haven't used on this site before.</p>

        <div id="form-message" class="form-message" role="alert" aria-live="polite" hidden></div>

        <p id="reset-status" class="subtitle">Checking your reset link...</p>

        <form id="reset-form" hidden>
          <div class="field">
            <label for="password">New password</label>
            <div class="password-wrap">
              <input type="password" id="password" autocomplete="new-password" minlength="8" required>
              <button type="button" class="toggle-pw" data-target="password" aria-pressed="false">Show</button>
            </div>
            <span class="hint">At least 8 characters, with a letter and a number.</span>
          </div>

          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <input type="password" id="confirm-password" autocomplete="new-password" required>
          </div>

          <button type="submit" class="btn btn-primary">Update password</button>
        </form>

        <div id="request-new" class="form-links" hidden>
          <p><a href="forgot-password.html">Request a new reset link</a></p>
        </div>
      </div>
    </main>

    <aside class="auth-right" aria-hidden="true">
      <div class="slide active"><img src="fashionheels.jpg" alt=""></div>
      <div class="overlay-content">
        <h2>Almost there</h2>
        <p>Set your new password and get back to shopping.</p>
      </div>
    </aside>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
</body>
</html>
