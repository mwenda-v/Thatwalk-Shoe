<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - MyApp</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .loading {
      text-align: center;
      font-size: 16px;
      color: orange;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-left">
      <h1 class="logo">MyApp</h1>
      <h2>Reset your password</h2>

      <!-- Step 1: Email form -->
      <form id="forgot-form">
        <input type="email" id="forgot-email" placeholder="Enter your email" required>
        <button type="submit" class="btn primary-btn">Send Reset Link</button>
      </form>

      <!-- Loading message -->
      <div id="loading" class="loading hidden">Sending reset link...</div>

      <!-- Step 2: New password form -->
      <form id="new-password-form" class="hidden">
        <input type="password" id="new-password" placeholder="Enter new password" required>
        <button type="submit" class="btn primary-btn">Register</button>
      </form>

      <p class="signup-link">Remembered your password? 
        <a href="login.html">Login</a>
      </p>
    </div>

    <div class="auth-right">
      <div class="artwork">
        <h3> Secure Access</h3>
        <p>We’ll send you a reset link to your email.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
</body>
</html>

  <script>
   // Forgot password flow
document.getElementById("forgot-form")?.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("forgot-email").value;

  // Show loading
  document.getElementById("loading").classList.remove("hidden");

  const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.href // user will come back here
  });

  setTimeout(() => {
    document.getElementById("loading").classList.add("hidden");
    if (error) {
      alert("Error: " + error.message);
    } else {
      alert("Reset link sent! Check your email.");
      // Show new password form
      document.getElementById("new-password-form").classList.remove("hidden");
    }
  }, 2000);
});

// Handle new password update
document.getElementById("new-password-form")?.addEventListener("submit", async (e) => {
  e.preventDefault();
  const newPassword = document.getElementById("new-password").value;

  const { data, error } = await supabase.auth.updateUser({
    password: newPassword,
  });

  if (error) {
    alert("Error updating password: " + error.message);
  } else {
    alert("Password successfully updated!");
    window.location.href = "services.html";
  }
});


  </script>
</body>
</html>
